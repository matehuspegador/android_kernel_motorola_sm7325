name: Compilar Kernel Motorola Edge 30 (dubai)

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  KERNELSU_VERSION: v0.9.5

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Kernel
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Instalar Dependências
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          curl \
          flex \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          git \
          libelf-dev \
          libssl-dev \
          lz4 \
          make \
          ninja-build \
          patchelf \
          python3 \
          rsync \
          unzip \
          wget \
          xz-utils \
          zip

    - name: Clonar Proton Clang
      run: |
        git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang.git \
          proton-clang

    - name: Configurar PATH
      run: |
        echo "$GITHUB_WORKSPACE/proton-clang/bin" >> $GITHUB_PATH

    - name: Integrar KernelSU
      run: |
        curl -LSs \
        https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
        | bash -s ${KERNELSU_VERSION}

    - name: Criar diretório de saída
      run: |
        mkdir -p out

    - name: Criar Fragmento de Configuração
      run: |
        mkdir -p arch/arm64/configs/vendor

        cat > arch/arm64/configs/vendor/dubai_fragment.config <<'EOF'
        #
        # KernelSU
        #
        CONFIG_KSU=y
        CONFIG_KSU_MANUAL_HOOK=y

        #
        # OverlayFS
        #
        CONFIG_OVERLAY_FS=y

        #
        # ZRAM
        #
        CONFIG_ZRAM=y
        CONFIG_ZSMALLOC=y
        CONFIG_ZSMALLOC_STAT=y
        CONFIG_LZ4_COMPRESS=y
        CONFIG_LZ4_DECOMPRESS=y

        #
        # Networking
        #
        CONFIG_TCP_CONG_BBR=y
        CONFIG_DEFAULT_BBR=y
        CONFIG_DEFAULT_TCP_CONG="bbr"
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y

        #
        # Scheduler (somente se suportado pelo defconfig)
        #
        CONFIG_UCLAMP_TASK=y
        CONFIG_CGROUP_SCHED=y

        #
        # NÃO alterar:
        # PREEMPT
        # VA_BITS
        # APPENDED_DTB
        # STACKPROTECTOR
        # HZ
        #
        EOF

    - name: Gerar Configuração Final
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        scripts/kconfig/merge_config.sh \
          -m \
          -O out \
          arch/arm64/configs/vendor/lahaina-qgki_defconfig \
          arch/arm64/configs/vendor/lineage_dubai.config \
          arch/arm64/configs/vendor/dubai_fragment.config

        make \
          O=out \
          ARCH=arm64 \
          olddefconfig

    - name: Verificar Configuração
      run: |
        echo "===== KernelSU ====="
        grep CONFIG_KSU out/.config || true

        echo "===== OverlayFS ====="
        grep CONFIG_OVERLAY_FS out/.config || true

        echo "===== ZRAM ====="
        grep CONFIG_ZRAM out/.config || true

        echo "===== TCP BBR ====="
        grep CONFIG_TCP_CONG_BBR out/.config || true

            - name: Compilar Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"

        export ARCH=arm64
        export SUBARCH=arm64

        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          STRIP=llvm-strip \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Verificar Kernel Gerado
      run: |
        echo "===== Kernel ====="

        test -f out/arch/arm64/boot/Image

        ls -lh out/arch/arm64/boot/Image

        file out/arch/arm64/boot/Image

    - name: Verificar DTBs
      run: |
        echo "===== DTBs ====="

        find out/arch/arm64/boot/dts \
          -name "*.dtb" \
          -print

    - name: Verificar DTBO
      run: |
        echo "===== DTBO ====="

        if [ -f out/arch/arm64/boot/dtbo.img ]; then
          echo "dtbo.img encontrado."
          ls -lh out/arch/arm64/boot/dtbo.img
        else
          echo "dtbo.img não encontrado."
        fi

    - name: Verificar Tamanho do Kernel
      run: |
        SIZE=$(stat -c%s out/arch/arm64/boot/Image)

        echo "Kernel Size = $SIZE bytes"

        if [ "$SIZE" -lt 38000000 ]; then
          echo "Kernel muito pequeno."
          exit 1
        fi

            - name: Baixar mkdtimg
      run: |
        wget \
          "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtimg.py?format=TEXT" \
          -O mkdtimg.base64

        base64 -d mkdtimg.base64 > mkdtimg.py

        chmod +x mkdtimg.py

    - name: Baixar AnyKernel3
      run: |
        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          anykernel

    - name: Copiar Kernel
      run: |
        cp out/arch/arm64/boot/Image anykernel/Image

    - name: Preparar DTBO
      run: |

        if [ -f out/arch/arm64/boot/dtbo.img ]; then

          echo "Usando dtbo.img gerado pelo kernel"

          cp out/arch/arm64/boot/dtbo.img anykernel/dtbo.img

        else

          echo "Gerando dtbo.img"

          mkdir -p anykernel/dts

          find out/arch/arm64/boot/dts \
            -name "*.dtbo" \
            -exec cp {} anykernel/dts/ \;

          DTBO_LIST=$(find anykernel/dts -name "*.dtbo")

          python3 mkdtimg.py create \
            anykernel/dtbo.img \
            $DTBO_LIST

        fi

    - name: Copiar DTBs (opcional)
      run: |
        mkdir -p anykernel/dts/vendor/qcom

        find out/arch/arm64/boot/dts \
          -name "*.dtb" \
          -exec cp {} anykernel/dts/vendor/qcom/ \;

    - name: Configurar AnyKernel3
      run: |

        sed -i \
          's|kernel.string=.*|kernel.string=Kernel Otimizado Dubai KSU|' \
          anykernel/anykernel.sh

        sed -i \
          's|device.name1=.*|device.name1=dubai|' \
          anykernel/anykernel.sh

        sed -i \
          '/device.name2=/c\device.name2=' \
          anykernel/anykernel.sh

        sed -i \
          '/device.name3=/c\device.name3=' \
          anykernel/anykernel.sh

        sed -i \
          '/device.name4=/c\device.name4=' \
          anykernel/anykernel.sh

        sed -i \
          '/device.name5=/c\device.name5=' \
          anykernel/anykernel.sh

        sed -i \
          's|BLOCK=.*|BLOCK=auto;|' \
          anykernel/anykernel.sh

        sed -i \
          's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' \
          anykernel/anykernel.sh

    - name: Verificar AnyKernel
      run: |
        echo "===== AnyKernel ====="

        ls -lh anykernel/

        test -f anykernel/Image

        test -f anykernel/dtbo.img

    - name: Validar Arquivos Finais
      run: |
        set -e

        echo "===== VALIDANDO ====="

        test -f anykernel/Image
        test -f anykernel/anykernel.sh
        test -f anykernel/tools/ak3-core.sh
        test -f anykernel/META-INF/com/google/android/update-binary

        if [ ! -f anykernel/dtbo.img ]; then
          echo "ERRO: dtbo.img não encontrado!"
          exit 1
        fi

        echo "Arquivos OK."

    - name: Mostrar Informações do Kernel
      run: |

        echo "===== IMAGE ====="

        ls -lh anykernel/Image

        sha256sum anykernel/Image

        echo ""

        echo "===== DTBO ====="

        ls -lh anykernel/dtbo.img

        sha256sum anykernel/dtbo.img

    - name: Limpar Arquivos Desnecessários
      run: |
        rm -rf anykernel/.git
        rm -rf anykernel/.github

        find anykernel -name "*.md" -delete

    - name: Criar ZIP AnyKernel3
      run: |

        cd anykernel

        zip -r9 \
          ../Kernel_Otimizado_Dubai_KSU.zip \
          . \
          -x "*.git*" \
          -x "*.github*"

    - name: Verificar ZIP
      run: |

        echo "===== ZIP ====="

        ls -lh Kernel_Otimizado_Dubai_KSU.zip

        unzip -l Kernel_Otimizado_Dubai_KSU.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Otimizado-Dubai-KSU
        path: Kernel_Otimizado_Dubai_KSU.zip
        if-no-files-found: error
        

        
        
