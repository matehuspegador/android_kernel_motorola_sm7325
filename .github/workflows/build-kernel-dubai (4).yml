# =============================================================================
# Build do kernel Motorola SM7325 (edge 30 "dubai") + KernelSU-Next
# =============================================================================

name: Build Kernel dubai (edge 30) + KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Branch/tag do kernel a compilar"
        required: true
        default: "lineage-20"
      defconfig:
        description: "Nome do defconfig (dentro de arch/arm64/configs/vendor/)"
        required: true
        default: "lahaina-qgki_defconfig"
      ksu_branch:
        description: "Branch do KernelSU-Next"
        required: true
        default: "legacy"
      ccache:
        description: "Usar ccache"
        type: boolean
        default: true

env:
  DEVICE_CODENAME: dubai
  KERNEL_REPO_OWNER: matehuspegador
  KERNEL_REPO_NAME: android_kernel_motorola_sm7325
  ARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: ci

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout do kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO_OWNER }}/${{ env.KERNEL_REPO_NAME }}
          ref: ${{ github.event.inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves \
            build-essential python3 python-is-python3 zip unzip device-tree-compiler \
            u-boot-tools rsync git curl ccache

      - name: Baixar toolchain (proton-clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"
          echo "$HOME/proton-clang/bin" >> "$GITHUB_PATH"

      - name: Configurar ccache
        if: ${{ github.event.inputs.ccache == 'true' }}
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache -M 6G

      - name: Cache ccache
        if: ${{ github.event.inputs.ccache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-dubai-${{ github.event.inputs.kernel_ref }}

      - name: Integrar KernelSU-Next Legacy
        working-directory: kernel
        run: |
          rm -rf KernelSU-Next drivers/kernelsu 2>/dev/null || true

          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next

          echo "Executando setup.sh oficial..."
          cd KernelSU-Next/kernel
          chmod +x setup.sh
          ./setup.sh || echo "setup.sh retornou erro (ver log)"

          cd ../../

          if [ -d "drivers/kernelsu" ]; then
            echo "✅ KernelSU-Next integrado via setup.sh"
          else
            echo "Tentando cópia manual..."
            cp -a KernelSU-Next/kernel/* drivers/ 2>/dev/null || true
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu 2>/dev/null || true
          fi

      - name: Aplicar fragmentos de config
        working-directory: kernel
        run: |
          cat > ksu_fix.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OF_OVERLAY=y
          CONFIG_OF_CONFIGFS=y
          CONFIG_OF_DYNAMIC=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          EOF

          FRAGMENTS="arch/arm64/configs/vendor/${{ github.event.inputs.defconfig }}"

          [ -f arch/arm64/configs/vendor/lineage_moto-lahaina.config ] && FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/lineage_moto-lahaina.config"
          [ -f arch/arm64/configs/vendor/lineage_dubai.config ] && FRAGMENTS="$FRAGMENTS arch/arm64/configs/vendor/lineage_dubai.config"
          FRAGMENTS="$FRAGMENTS ksu_fix.config"

          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m $FRAGMENTS

      - name: Compilar Kernel (Image + dtbs)
        working-directory: kernel
        env:
          DTC_FLAGS: "-@"
        run: |
          make -C $(pwd) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc --all) Image dtbs || echo "Build dtbs falhou, mas continuando..."

      - name: Gerar dtbo.img
        working-directory: kernel
        run: |
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "dtbo.img já existe"
          else
            echo "Gerando dtbo.img manualmente..."
            curl -LSs -o mkdtboimg.py https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT
            base64 -d mkdtboimg.py > mkdtboimg.py && chmod +x mkdtboimg.py
            find out -name "*.dtbo" | grep -i dubai | xargs python3 mkdtboimg.py create out/arch/arm64/boot/dtbo.img
          fi

      - name: Verificar artefatos
        working-directory: kernel
        run: |
          echo "IMAGE_PATH=$(pwd)/out/arch/arm64/boot/Image" >> "$GITHUB_ENV"
          echo "DTBO_PATH=$(pwd)/out/arch/arm64/boot/dtbo.img" >> "$GITHUB_ENV"
          find out -name "*.dtb" -not -name "*overlay*" | head -c 10M > out/dtb 2>/dev/null || true
          echo "DTB_PATH=$(pwd)/out/dtb" >> "$GITHUB_ENV"

      - name: Clonar AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Montar anykernel.sh
        working-directory: anykernel
        run: |
          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=KernelSU-Next Legacy - Motorola edge 30 (dubai)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=dubai
          device.name2=XT2203
          device.name3=motorola_dubai
          '; }

          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=1
          ramdisk_compression=auto
          patch_vbmeta_flag=0
          no_magisk_check=1

          . tools/ak3-core.sh

          dump_boot
          write_boot
          EOF

      - name: Copiar arquivos e criar ZIP
        run: |
          cp "${{ env.IMAGE_PATH }}" anykernel/Image
          cp "${{ env.DTBO_PATH }}" anykernel/dtbo.img
          [ -f "${{ env.DTB_PATH }}" ] && cp "${{ env.DTB_PATH }}" anykernel/dtb

          cd anykernel
          ZIP_NAME="KernelSU-Next-dubai-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" . -x ".git*"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dubai-ksu-next
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
