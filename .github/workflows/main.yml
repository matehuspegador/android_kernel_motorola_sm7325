name: Build sm7325 Kernel 5.4 (FPS + KernelSU) - Dubai

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch do kernel"
        required: true
        default: "lineage-22.2"
      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - "KernelSU-Next (fork da comunidade)"
          - "KernelSU oficial"
        default: "KernelSU-Next (fork da comunidade)"

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm7325.git
  KERNEL_DIR: kernel_src
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev liblz4-tool libncurses5-dev lzop zip zstd \
            device-tree-compiler

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm7325-5.4-dubai-${{ github.sha }}

      - name: Clonar kernel (lineage-22.2)
        run: git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Baixar Proton Clang
        run: |
          mkdir -p clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Integrar KernelSU
        run: |
          cd "$KERNEL_DIR"
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next (fork da comunidade)" ]; then
            echo "Instalando KernelSU-Next..."
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.0.0/kernel/setup.sh | bash -s v3.0.0 legacy
          else
            echo "Instalando KernelSU oficial..."
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s --
          fi

      - name: Corrigir fsnotify_ops (Kernel 5.4)
        run: |
          cd "$KERNEL_DIR"
          FILE=$(find drivers/kernelsu -name "pkg_observer.c" 2>/dev/null | head -n1)
          if [ -n "$FILE" ]; then
            echo "🔧 Corrigindo fsnotify_ops com printf..."
            cp "$FILE" "$FILE.bak"
            
            printf 'static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,\n' >> "$FILE"
            printf '                                  struct inode *inode, struct inode *dir,\n' >> "$FILE"
            printf '                                  const struct qstr *name, u32 cookie)\n' >> "$FILE"
            printf '{\n' >> "$FILE"
            printf '    return 0;\n' >> "$FILE"
            printf '}\n\n' >> "$FILE"
            printf 'static const struct fsnotify_ops ksu_fsnotify_ops = {\n' >> "$FILE"
            printf '    .handle_event = ksu_handle_inode_event,\n' >> "$FILE"
            printf '};\n' >> "$FILE"
            
            # Remove declaração antiga se existir
            sed -i '/static const struct fsnotify_ops ksu_fsnotify_ops = {/,/};/d' "$FILE"
            
            echo "✅ fsnotify_ops corrigido com printf!"
          fi

      - name: Fix Moto DT Overlay Error
        run: |
          cd "$KERNEL_DIR"
          echo "🔧 Aplicando fix agressivo para Moto DT Overlay..."
          
          # Método 1: Adicionar no Makefile
          printf "\nMOT_DT_OVERLAY := y\n" >> arch/arm64/boot/dts/vendor/qcom/Makefile || true
          
          # Método 2: Criar/Editar arquivo de overlay
          mkdir -p arch/arm64/boot/dts/vendor/qcom
          printf "#define MOT_DT_OVERLAY 1\n" > arch/arm64/boot/dts/vendor/qcom/dubai-overlay.dtsi || true
          
          # Método 3: Forçar variável de ambiente
          export MOT_DT_OVERLAY=y
          echo "MOT_DT_OVERLAY=y" >> Makefile || true
          
          echo "✅ Fix Moto DT Overlay aplicado"
          cat arch/arm64/boot/dts/vendor/qcom/Makefile | tail -n 10
          
      - name: Corrigir allowlist.c
        run: |
          cd "$KERNEL_DIR"
          FILE="drivers/kernelsu/allowlist.c"
          if [ -f "$FILE" ]; then
            sed -i 's/TWA_RESUME/true/g' "$FILE"
            grep -q "#include <linux/sched/task.h>" "$FILE" || sed -i '1i #include <linux/sched/task.h>' "$FILE"
          fi

      - name: Configurar kernel (dubai + FPS)
        run: |
          cd "$KERNEL_DIR"
          make O=../$OUT_DIR ARCH=arm64 vendor/lahaina-qgki_defconfig
          ./scripts/kconfig/merge_config.sh -O ../$OUT_DIR \
            ../$OUT_DIR/.config \
            ../configs/fps_optimizations.config 2>/dev/null || true
          make O=../$OUT_DIR ARCH=arm64 olddefconfig

      - name: Compilar Kernel
        run: |
          cd "$KERNEL_DIR"
          make -j$(nproc) O=../$OUT_DIR ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-O2" 2>&1 | tee build.log

      - name: Empacotar AnyKernel3
        run: |
          IMG=$(find $OUT_DIR -name "Image.gz-dtb" -o -name "Image" | head -n1)
          if [ -z "$IMG" ]; then
            echo "❌ Build falhou!"
            tail -n 150 build.log
            exit 1
          fi
          git clone --depth=1 $ANYKERNEL_REPO anykernel
          cp "$IMG" anykernel/
          find $OUT_DIR -name "*.dtb" -exec cp {} anykernel/ \;
          cd anykernel
          zip -r9 "../dubai-kernel-5.4-fps-ksu-$(date +%Y%m%d-%H%M).zip" . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edge30-Dubai-Kernel-5.4-KSU
          path: "*.zip"
          retention-days: 14
