name: Compilar Kernel Motorola Edge 30 (dubai) - lineage-23.2

on:
  workflow_dispatch:

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm7325.git

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lz4 make python3 rsync unzip wget zip

      - name: Clonar Kernel (lineage-23.2)
        run: git clone --depth=1 -b lineage-23.2 "$KERNEL_REPO" kernel_src

      - name: Clonar Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang

      - name: Configurar PATH
        run: echo "$GITHUB_WORKSPACE/proton-clang/bin" >> $GITHUB_PATH

      - name: Integrar KernelSU-Next
        run: |
          cd kernel_src
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.0.0/kernel/setup.sh | bash -s v3.0.0 legacy

      - name: Configurar Kernel
        run: |
          cd kernel_src
          mkdir -p out
          make O=out ARCH=arm64 vendor/lahaina-qgki_defconfig
          make O=out ARCH=arm64 olddefconfig

      - name: Compilar Kernel
        run: |
          cd kernel_src
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Baixar AnyKernel3
        run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Preparar AnyKernel
        run: |
          cp kernel_src/out/arch/arm64/boot/Image anykernel/
          
          # Copia DTBs
          mkdir -p anykernel/dts
          find kernel_src/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} anykernel/dts/ \;
          
          # Importante: DTBO
          if [ -f kernel_src/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel_src/out/arch/arm64/boot/dtbo.img anykernel/
            echo "dtbo.img copiado do build"
          else
            echo "Aviso: dtbo.img não encontrado no build"
          fi
          
          cd anykernel
          sed -i 's|kernel.string=.*|kernel.string=Edge 30 KSU Next|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=dubai|' anykernel.sh
          
      - name: Criar ZIP
        run: |
          cd anykernel
          zip -r9 ../Kernel_Edge30_dubai_KSU-Next.zip . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Edge30_dubai_KSU-Next
          path: Kernel_Edge30_dubai_KSU-Next.zip
