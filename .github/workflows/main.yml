name: Build sm7325 Kernel 5.4 (FPS + KernelSU)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch do kernel"
        required: true
        default: "lineage-22.2"
      device_codename:
        description: "Codinome do dispositivo"
        required: true
        default: "dubai"
      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - "tiann/KernelSU (oficial)"
          - "KernelSU-Next (fork da comunidade)"
        default: "tiann/KernelSU (oficial)"

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm7325.git
  KERNEL_DIR: kernel_src
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev liblz4-tool libncurses5-dev lzop zip zstd \
            device-tree-compiler

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm7325-5.4-${{ github.sha }}

      - name: Clonar kernel
        run: git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Baixar Proton Clang
        run: |
          mkdir -p clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          ls -la clang/bin/ | grep -E "clang$|aarch64" | head -n 5

      - name: Aplicar patches (pasta patches/)
        run: |
          cd "$KERNEL_DIR"
          git config user.email "ci@localhost"
          git config user.name "CI Bot"
          if [ -d "../patches" ] && [ "$(ls ../patches/*.patch 2>/dev/null)" ]; then
            for p in $(ls ../patches/*.patch | sort); do
              echo "Aplicando: $(basename "$p")"
              if git am --3way "$p" 2>/dev/null; then
                echo "   Sucesso"
              elif git apply --ignore-whitespace --reject --whitespace=fix "$p" 2>/dev/null; then
                echo "   Sucesso (apply)"
              else
                echo "   Falhou (continuando)"
              fi
            done
          fi

      - name: Corrigir bug de ordem de argumentos em task_mmu.c
        run: |
          cd "$KERNEL_DIR"
          FILE="fs/proc/task_mmu.c"
          if grep -q "split_huge_pmd(vma, addr, pmd);" "$FILE"; then
            sed -i 's/split_huge_pmd(vma, addr, pmd);/split_huge_pmd(vma, pmd, addr);/' "$FILE"
            echo "Corrigido split_huge_pmd"
          fi

      - name: Integrar KernelSU
        run: |
          cd "$KERNEL_DIR"
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next (fork da comunidade)" ]; then
            echo "Instalando KernelSU-Next..."
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.0.0/kernel/setup.sh | bash -s v3.0.0 legacy
          else
            echo "Instalando KernelSU oficial..."
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s --
          fi

      - name: Patch completo para KernelSU 5.4 (fsnotify)
        run: |
          cd "$KERNEL_DIR"
          FILE=$(find drivers/kernelsu -name "pkg_observer.c" 2>/dev/null | head -n1)
          if [ -n "$FILE" ]; then
            echo "Aplicando patch em $FILE"
            cp "$FILE" "$FILE.bak"
            
            # Remove linha problemática
            sed -i '/\.handle_inode_event = ksu_handle_inode_event,/d' "$FILE"
            
            # Adiciona handler correto para kernel 5.4
            sed -i '/static const struct fsnotify_ops ksu_fsnotify_ops = {/a \    .handle_event = ksu_handle_inode_event,' "$FILE"
            
            echo "--- Verificação final ---"
            grep -A15 "fsnotify_ops" "$FILE"
          fi

      - name: Corrigir allowlist.c (task_work_add)
        run: |
          cd "$KERNEL_DIR"
          FILE="drivers/kernelsu/allowlist.c"
          if [ -f "$FILE" ]; then
            sed -i 's/task_work_add(tsk, cb, TWA_RESUME);/task_work_add(tsk, cb, true);/' "$FILE"
            if ! grep -q "#include <linux/sched/task.h>" "$FILE"; then
              sed -i '1i #include <linux/sched/task.h>' "$FILE"
            fi
            echo "allowlist.c corrigido"
          fi

      - name: Corrigir compatibilidade linux/pgtable.h
        run: |
          cd "$KERNEL_DIR"
          if [ ! -f include/linux/pgtable.h ]; then
            mkdir -p include/linux
            cat > include/linux/pgtable.h << 'EOF'
          #ifndef _LINUX_PGTABLE_H
          #define _LINUX_PGTABLE_H
          #include <asm/pgtable.h>
          #endif
          EOF
          fi

      - name: Configurar kernel + Otimizações
        run: |
          cd "$KERNEL_DIR"
          make O=../$OUT_DIR ARCH=arm64 \
            vendor/lahaina-qgki_defconfig \
            vendor/lineage_moto-lahaina.config \
            vendor/lineage_dubai.config
          
          ./scripts/kconfig/merge_config.sh -O ../$OUT_DIR \
            ../$OUT_DIR/.config \
            ../configs/fps_optimizations.config
          
          make O=../$OUT_DIR ARCH=arm64 olddefconfig

      - name: Compilar Kernel
        run: |
          cd "$KERNEL_DIR"
          make -j$(nproc) O=../$OUT_DIR ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-O2" \
            2>&1 | tee build.log

      - name: Empacotar AnyKernel3
        run: |
          IMG=$(find $OUT_DIR -name "Image*" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build falhou!"
            tail -n 200 build.log
            exit 1
          fi
          git clone --depth=1 $ANYKERNEL_REPO anykernel
          cp "$IMG" anykernel/
          find $OUT_DIR -name "*.dtb" -exec cp {} anykernel/ \;
          cd anykernel
          zip -r9 "../dubai-kernel-5.4-fps-ksu-$(date +%Y%m%d-%H%M).zip" . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dubai-5.4-fps-ksu
          path: "*.zip"
          retention-days: 14
