name: Build Kernel 5.4 Dubai (lineage-23.2)

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - "KernelSU-Next"
          - "KernelSU oficial"
        default: "KernelSU-Next"

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm7325.git
  KERNEL_DIR: kernel_src
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev liblz4-tool libncurses5-dev lzop zip zstd \
            device-tree-compiler

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm7325-dubai-${{ github.sha }}

      - name: Clonar Kernel
        run: git clone --depth=1 -b lineage-23.2 "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Baixar Proton Clang
        run: |
          mkdir -p clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"

      - name: Integrar KernelSU
        run: |
          cd "$KERNEL_DIR"
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next" ]; then
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.0.0/kernel/setup.sh | bash -s v3.0.0 legacy
          else
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s --
          fi

      - name: Configurar Kernel
        run: |
          cd "$KERNEL_DIR"
          make O=../$OUT_DIR ARCH=arm64 vendor/lahaina-qgki_defconfig
          make O=../$OUT_DIR ARCH=arm64 olddefconfig

      - name: Compilar
        run: |
          cd "$KERNEL_DIR"
          make -j$(nproc) O=../$OUT_DIR ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log

      - name: Empacotar
        run: |
          IMG=$(find $OUT_DIR -name "Image.gz-dtb" -o -name "Image" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build falhou!"
            tail -n 100 build.log
            exit 1
          fi
          git clone --depth=1 $ANYKERNEL_REPO anykernel
          cp "$IMG" anykernel/
          find $OUT_DIR -name "*.dtb" -exec cp {} anykernel/ \;
          cd anykernel
          zip -r9 "../dubai-kernel-5.4-ksu-$(date +%Y%m%d-%H%M).zip" . -x ".git*"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dubai-kernel-5.4-ksu
          path: "*.zip"
          retention-days: 14
