name: Build sm7325 Kernel 5.4 (FPS + KernelSU)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch do kernel"
        required: true
        default: "lineage-22.2"
      device_codename:
        description: "Codinome do dispositivo"
        required: true
        default: "dubai"
      kernelsu_variant:
        description: "KernelSU Variant"
        type: choice
        options:
          - "tiann/KernelSU (oficial)"
          - "KernelSU-Next (fork da comunidade)"
        default: "tiann/KernelSU (oficial)"

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_motorola_sm7325.git
  KERNEL_DIR: kernel_src
  OUT_DIR: out
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git
  CLANG_URL: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/20241012/neutron-clang-20241012.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev liblz4-tool libncurses5-dev lzop zip zstd \
            device-tree-compiler

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sm7325-5.4-${{ github.sha }}

      - name: Clonar kernel
        run: git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Baixar Toolchain Clang (Método Funcionando)
        run: |
          mkdir -p clang
          
          echo "Baixando Clang estável para kernel 5.4..."
          curl -L --progress-bar -o clang.tar.gz \
            "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902/releases/download/14.0.6/clang-14.0.6.tar.gz"
          
          echo "Extraindo..."
          tar -xzf clang.tar.gz -C clang
          
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "✅ Clang configurado!"
          ls -la clang/bin/ | grep -E "clang$|aarch64" | head -n 5

      - name: Aplicar patches (pasta patches/)
        run: |
          cd "$KERNEL_DIR"
          git config user.email "ci@localhost"
          git config user.name "CI Bot"
          
          if [ -d "../patches" ] && [ "$(ls ../patches/*.patch 2>/dev/null)" ]; then
            for p in $(ls ../patches/*.patch | sort); do
              echo "Aplicando: $(basename $p)"
              if git am --3way "$p" 2>/dev/null; then
                echo "   ✅ Sucesso"
              elif git apply --ignore-whitespace --reject --whitespace=fix "$p" 2>/dev/null; then
                echo "   ✅ Sucesso (apply)"
              else
                echo "   ⚠️ Falhou (continuando)"
              fi
            done
          fi

      - name: Integrar KernelSU
        run: |
          cd "$KERNEL_DIR"
          if [ "${{ github.event.inputs.kernelsu_variant }}" = "KernelSU-Next (fork da comunidade)" ]; then
            echo "Instalando KernelSU-Next..."
            curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s --
          else
            echo "Instalando KernelSU oficial..."
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s --
          fi

      - name: Configurar kernel + Otimizações
        run: |
          cd "$KERNEL_DIR"
          make O=../$OUT_DIR ARCH=arm64 \
            vendor/lahaina-qgki_defconfig \
            vendor/lineage_moto-lahaina.config \
            vendor/lineage_dubai.config

          # Tuning + KernelSU
          ./scripts/config --file ../$OUT_DIR/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_HZ_300 \
            -e CONFIG_ZRAM \
            -e CONFIG_ZRAM_DEF_COMP_LZ4 \
            -e CONFIG_TRANSPARENT_HUGEPAGE \
            -e CONFIG_IOSCHED_BFQ \
            -e CONFIG_DRM_MSM_ADRENO_6XX \
            -e CONFIG_MSM_ADRENO_BOOST \
            -d CONFIG_DEBUG_KERNEL \
            -d CONFIG_FTRACE

      - name: Compilar Kernel
        run: |
          cd "$KERNEL_DIR"
          make O=../$OUT_DIR ARCH=arm64 olddefconfig
          
          make -j$(nproc) O=../$OUT_DIR ARCH=arm64 \
            CC="ccache clang" LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-O3 -flto=thin -fomit-frame-pointer" \
            2>&1 | tee build.log

      - name: Empacotar AnyKernel3
        run: |
          IMG=$(find $OUT_DIR -name "Image*" | head -n1)
          if [ -z "$IMG" ]; then
            echo "Build falhou!"
            tail -n 100 build.log
            exit 1
          fi
          
          git clone --depth=1 $ANYKERNEL_REPO anykernel
          cp $IMG anykernel/
          find $OUT_DIR -name "*.dtb" -exec cp {} anykernel/ \;
          
          cd anykernel
          zip -r9 "../dubai-kernel-5.4-fps-ksu-$(date +%Y%m%d-%H%M).zip" . -x ".git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dubai-5.4-fps-ksu
          path: "*.zip"
          retention-days: 14
